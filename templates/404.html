<!DOCTYPE html>

<html lang="sw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

  
<title>
    {% if church_settings and church_settings["church_name"] %}
        {{ church_settings["church_name"] }} — Ukurasa Haupo
    {% else %}
        Ukurasa Haupo
    {% endif %}
</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

  
<main class="error-page">

    <section class="error-card">

        {% if church_settings and church_settings["church_name"] %}
            <div class="error-church-name">
                {{ church_settings["church_name"] }}
            </div>
        {% endif %}

        <div class="error-icon">
            🔍
        </div>

        <div class="error-code">404</div>

        <h1>Ukurasa Haupatikani</h1>

        <p>
            Samahani, ukurasa unaoutafuta haupo au huenda
            umehamishwa kwenda sehemu nyingine.
        </p>

        <div class="error-actions">
            <a href="{{ url_for('home') }}" class="primary-button">
                ← Rudi Mwanzo
            </a>
        </div>

    </section>

</main>
  

</body>
</html>
