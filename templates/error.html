<!DOCTYPE html>

<html lang="sw">

<head>

  
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    {% if church_settings and church_settings["church_name"] %}
        {{ church_settings["church_name"] }} — System Error
    {% else %}
        System Error
    {% endif %}
</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>

</head>

<body>

  
<main class="error-page">

    <section class="error-card">

        {% if church_settings and church_settings["church_name"] %}
            <div class="error-church-name">
                {{ church_settings["church_name"] }}
            </div>
        {% endif %}

        <div class="error-icon">
            ⚠️
        </div>

        <span class="dashboard-label">
            SYSTEM ERROR
        </span>

        <h1>
            Kuna Tatizo
        </h1>

        <p class="error-message">
            {{ message }}
        </p>

        <div class="error-actions">

            <a
                href="{{ url_for('home') }}"
                class="primary-button"
            >
                ← RUDI MWANZO
            </a>

        </div>

    </section>

</main>
  

</body>

</html>
