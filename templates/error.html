<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Error</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
            text-align: center;
        }

        .error-box {
            max-width: 500px;
            padding: 40px 25px;
        }

        h1 {
            font-size: 60px;
            margin: 0;
        }

        h2 {
            margin: 10px 0;
        }

        p {
            color: #666;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="error-box">
        <h1>⚠️</h1>
        <h2>System Error</h2>
        <p>{{ message }}</p>

        <a href="{{ url_for('login') }}">Go Home</a>
    </div>

</body>
</html>
